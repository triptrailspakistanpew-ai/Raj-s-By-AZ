<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" fill="none" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Montserrat:wght@400;500;600&amp;display=swap');
      .brand-title {
        font-family: 'Cinzel', 'Playfair Display', Didot, 'Bodoni MT', Georgia, serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 0.12em;
        fill: #221D1A;
      }
      .brand-sub {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.42em;
        fill: #766B64;
      }
    </style>
  </defs>

  <!-- Left/Integrated Brand Icon (Rainbow Arch + Bow) -->
  <g transform="translate(10, 14) scale(0.92)">
    <!-- Rainbow Arches -->
    <path 
      d="M 20 96 L 20 62 A 40 40 0 0 1 100 62 L 100 96" 
      stroke="#D58380" 
      stroke-width="8.5" 
      stroke-linecap="butt"
      fill="none" 
    />
    <path 
      d="M 32 96 L 32 62 A 28 28 0 0 1 88 62 L 88 96" 
      stroke="#DFCEBA" 
      stroke-width="8" 
      stroke-linecap="butt"
      fill="none" 
    />
    <path 
      d="M 43.5 96 L 43.5 62 A 16.5 16.5 0 0 1 76.5 62 L 76.5 96" 
      stroke="#EDB5A8" 
      stroke-width="7.5" 
      stroke-linecap="butt"
      fill="none" 
    />

    <!-- Ribbon Bow at Apex -->
    <g fill="#D97A84">
      <path 
        d="M 57 23 C 51 22, 42 16, 42 11 C 42 7.5, 46.5 6.5, 50 9 C 54 12, 57 18.5, 58.5 21 Z" 
        stroke="#C96874" 
        stroke-width="0.8" 
      />
      <path 
        d="M 63 23 C 69 22, 78 16, 78 11 C 78 7.5, 73.5 6.5, 70 9 C 66 12, 63 18.5, 61.5 21 Z" 
        stroke="#C96874" 
        stroke-width="0.8" 
      />
      <path 
        d="M 57 24 C 55 28, 49 37, 47 43 C 49.5 42, 52 42.5, 54 44 C 54.5 39, 58 29, 60 25 Z" 
        fill="#CE6E79" 
      />
      <path 
        d="M 63 24 C 65 28, 71 37, 73 43 C 70.5 42, 68 42.5, 66 44 C 65.5 39, 62 29, 60 25 Z" 
        fill="#CE6E79" 
      />
      <ellipse cx="60" cy="22.5" rx="3.8" ry="3.2" fill="#D97A84" stroke="#B85964" stroke-width="0.8" />
    </g>
  </g>

  <!-- Typography: Raj's By AZ -->
  <g transform="translate(125, 30)">
    <text x="0" y="44" class="brand-title">Raj&apos;s</text>
    <text x="2" y="68" class="brand-sub">BY AZ</text>
  </g>
</svg>
